# --------------------------------------------------
# H2 プロファイル: PostgreSQL を用意せずに動かす
#   ./mvnw -DskipTests package && java -jar target/vsbp-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2
# 学生 DB・教員 DB とも H2 のインメモリ DB（PostgreSQL 互換モード）にする。
# テーブルと初期データは既存の DataBase/*.sql が起動時に流し込む。
# --------------------------------------------------
vaadin.launch-browser=false

spring.datasource.gakusei.url=jdbc:h2:mem:gakusei;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.gakusei.username=sa
spring.datasource.gakusei.password=
spring.datasource.gakusei.driver-class-name=org.h2.Driver

spring.datasource.kyouin.url=jdbc:h2:mem:kyouin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.kyouin.username=sa
spring.datasource.kyouin.password=
spring.datasource.kyouin.driver-class-name=org.h2.Driver
